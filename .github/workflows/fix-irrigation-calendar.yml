name: Fix irrigation calendar anchors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch irrigation calendar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/irrigazione/page.js")
          text = path.read_text()

          old = '''      const anchor = new Date(\n        2026,\n        8,\n        1,\n        hours,\n        minutes,\n        0,\n        0\n      );'''

          new = '''      /*\n       * Ogni programmazione a intervallo ha la propria\n       * data di partenza. Non possiamo usare una sola\n       * ancora per tutti i programmi: il programma delle\n       * 20:00 parte il 01/09/2026, mentre quello delle\n       * 06:00 parte il 05/09/2026.\n       */\n      const intervalAnchors = {\n        "20:00": new Date(\n          2026,\n          8,\n          1,\n          hours,\n          minutes,\n          0,\n          0\n        ),\n        "06:00": new Date(\n          2026,\n          8,\n          5,\n          hours,\n          minutes,\n          0,\n          0\n        ),\n      };\n\n      const anchor =\n        intervalAnchors[program.time];\n\n      /*\n       * Se in futuro compare un nuovo programma a\n       * intervallo non ancora associato a una data di\n       * partenza, non inventiamo una data nel calendario.\n       */\n      if (!anchor) {\n        return occurrences;\n      }'''

          if old not in text:
              raise SystemExit("Blocco anchor non trovato: nessuna modifica applicata")

          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-irrigation-calendar.yml
          git add app/irrigazione/page.js
          git commit -m "fix: use separate anchors for irrigation intervals"
          git push