name: Fix irrigation calendar

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "${{ github.event.head_commit.message != 'chore: apply automatic irrigation calendar fix' }}"
    steps:
      - uses: actions/checkout@v4

      - name: Patch calendar logic
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/irrigazione/page.js")
          text = path.read_text(encoding="utf-8")

          start_marker = '''    if (
      program.recurrenceType === 1 &&
      Number.isInteger(program.intervalDays) &&
      program.intervalDays >= 2
    ) {'''

          end_marker = '''    if (
      program.recurrenceType === 1 &&
      Array.isArray(program.weekdays) &&
      program.weekdays.length > 0
    ) {'''

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''    if (
      program.recurrenceType === 1 &&
      Number.isInteger(program.intervalDays) &&
      program.intervalDays >= 2
    ) {
      const intervalDays = program.intervalDays;

      /* Tuya supplies the real start date through Device Timer API. */
      if (!program.startDate) {
        console.warn(
          "Programma Tuya senza data di partenza:",
          program
        );
        return occurrences;
      }

      const anchorParts =
        String(program.startDate).split("-").map(Number);

      if (
        anchorParts.length !== 3 ||
        anchorParts.some(
          (value) => !Number.isInteger(value)
        )
      ) {
        return occurrences;
      }

      const anchor = new Date(
        anchorParts[0],
        anchorParts[1] - 1,
        anchorParts[2],
        hours,
        minutes,
        0,
        0
      );

      if (Number.isNaN(anchor.getTime())) {
        return occurrences;
      }

      const endTime = new Date(now);
      endTime.setHours(0, 0, 0, 0);
      endTime.setDate(endTime.getDate() + daysAhead);

      let date = new Date(anchor);

      if (date <= now) {
        const today = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );

        const anchorDay = new Date(
          anchor.getFullYear(),
          anchor.getMonth(),
          anchor.getDate()
        );

        const elapsedDays = Math.floor(
          (today.getTime() - anchorDay.getTime()) /
            (24 * 60 * 60 * 1000)
        );

        const cycles =
          Math.floor(elapsedDays / intervalDays) + 1;

        date.setDate(
          date.getDate() + cycles * intervalDays
        );
      }

      while (date <= endTime) {
        if (date > now) {
          occurrences.push({
            id:
              `tuya-${program.dp}-${program.index}-${date.getTime()}`,
            type: "programmata",
            source: "tuya",
            program: program.index,
            time: program.time,
            durationMinutes: program.durationMinutes,
            date: date.toISOString(),
          });
        }

        date = new Date(date);
        date.setDate(date.getDate() + intervalDays);
      }

      return occurrences;
    }

'''

          if start == text.index(start_marker, start) and end > start:
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding="utf-8",
              )
          else:
              raise SystemExit("Impossibile individuare il blocco calendario")
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit automatic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-irrigation-calendar.yml
          git add app/irrigazione/page.js .github/workflows/fix-irrigation-calendar.yml
          git commit -m "chore: apply automatic irrigation calendar fix"
          git push
